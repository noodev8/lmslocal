org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin comes from AGP itself, not the Kotlin Gradle plugin. Flutter warns on KGP
# and will fail the build on it in a future release. This holds only while every
# plugin has also migrated — shared_preferences_android needed 2.4.24 for it — so a
# plugin bump that reintroduces KGP will surface here, not silently.
android.builtInKotlin=true
# Still the old DSL. The migration guide leaves this at false; newDsl is a separate
# AGP 9 change and nothing here depends on it.
android.newDsl=false
