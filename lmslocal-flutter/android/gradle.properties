org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Both flags were written by the Flutter migrator and were inert under AGP 8.
# Under AGP 9 they are load-bearing: built-in Kotlin defaults ON, so this is the
# only thing keeping the app on the Kotlin Gradle plugin. Removing it is the
# built-in Kotlin migration, not a tidy-up — and it cannot be done alone, because
# shared_preferences_android applies KGP too until 2.4.24.
android.builtInKotlin=false
android.newDsl=false
